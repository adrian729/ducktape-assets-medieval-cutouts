title: Animal musicians in a framed miniature
description: "A complete framed miniature on a diapered blue, gold and pink ground: on green grass a hooded dog-like animal sings from an open book on a lectern, a spotted creature plays a fiddle, a donkey plays a portative organ, white geese gather in the middle, a red fox plays beside a drum, a small white animal rings bells on a stand at the right and a harp lies on the ground. Fully opaque, with pink and green border columns; nothing is transparent."
